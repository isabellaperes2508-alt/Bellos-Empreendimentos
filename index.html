function proposals(){return title('Propostas e simulações','Encontre condições que façam sentido para cada negociação.')+`<div class="grid"><section class="panel"><h2>Simulador de compra</h2><form onsubmit="saveProposal(event)"><label>Lote</label><select id="simlot" onchange="calc()">${lots.map(l=>`<option value="${l.id}">Lote ${l.id} · ${l.area} m²</option>`).join('')}</select><div class="split"><div><label>Entrada (%)</label><input id="entry" type="number" min="0" max="100" value="20" oninput="calc()" required></div><div><label>Número de parcelas</label><input id="months" type="number" min="1" max="240" value="60" oninput="calc()" required></div></div><label>Juros mensais (%) · tabela Price</label><input id="interest" type="number" min="0" max="10" step="0.01" value="0" oninput="calc()" required><label>Nome do interessado</label><input id="propname" required maxlength="100" placeholder="Nome para a proposta"><div id="calcresult"></div><button class="primary">Salvar proposta demonstrativa</button></form><div class="notice">Preço-base fictício de R$ 650/m², arredondado. Reajustes e regras contratuais oficiais ainda não foram informados.</div></section><section class="panel"><h2>Propostas salvas</h2>${db.proposals.map(p=>`<div class="row"><div><b>${esc(p.name)}</b><small>Lote ${p.lot} · ${p.months} × ${money(p.payment)}</small></div><button onclick="downloadProposal(${p.id})">Baixar</button></div>`).join('')||'<p>Salve sua primeira simulação para acompanhar aqui.</p>'}<h2 style="margin-top:30px">Comissões · exemplo</h2><p>Percentual ilustrativo: 5% sobre o valor da venda. Sem vínculo com a regra comercial real.</p>${db.leads.filter(l=>l.stage==='Fechado'&&(role!=='Corretor'||l.owner==='Marina Alves')).map(l=>`<div class="row"><div>${esc(l.owner)}<small>Lote ${l.lot} · ${esc(l.name)}</small></div><b>${money(price(lots.find(x=>x.id===l.lot))*0.05)}</b></div>`).join('')}</section></div>`}
function calcValues(){const l=lots.find(l=>l.id===+$('#simlot').value),total=price(l),entry=total*+$('#entry').value/100,n=+$('#months').value,r=+$('#interest').value/100,balance=total-entry;return {lot:l.id,total,entry,months:n,interest:r,payment:n>0?(r?balance*r/(1-Math.pow(1+r,-n)):balance/n):0}}function calc(){const p=calcValues();$('#calcresult').innerHTML=`<div class="row"><span>Valor simulado</span><b>${money(p.total)}</b></div><div class="row"><span>Entrada</span><b>${money(p.entry)}</b></div><div class="row"><span>Parcela estimada</span><b class="big">${money(p.payment)}</b></div>`}function saveProposal(e){e.preventDefault();db.proposals.push({...calcValues(),name:$('#propname').value,id:Date.now(),owner:role==='Corretor'?'Marina Alves':'Gestão'});save();render();toast('Proposta salva.')}function downloadText(name,text,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function downloadProposal(id){let p=db.proposals.find(p=>p.id===id);downloadText('proposta-floratta-demo.txt',`RESIDENCIAL FLORATTA — PROPOSTA DEMONSTRATIVA\nSem validade contratual\nCliente fictício: ${p.name}\nLote ${p.lot}\nValor simulado: ${money(p.total)}\nEntrada: ${money(p.entry)}\nParcelamento: ${p.months} × ${money(p.payment)}\nJuros mensais: ${p.interest*100}%\nCondições sujeitas a aprovação. Não é contrato.`)}
function finance(){const ps=visiblePayments();return title('Financeiro sob controle','Parcelas, taxas, despesas e comprovantes em um só lugar.',`<button class="primary" onclick="expenseForm()">+ Novo lançamento</button>`)+stats([['Recebido',money(ps.filter(p=>p.status==='Pago'&&p.value>0).reduce((a,p)=>a+p.value,0)),'Pagamentos fictícios'],['A receber',money(ps.filter(p=>p.status!=='Pago'&&p.value>0).reduce((a,p)=>a+p.value,0)),'Inclui parcelas e taxas'],['Em atraso',money(ps.filter(p=>p.status==='Vencido').reduce((a,p)=>a+p.value,0)),'Dados de exemplo'],['Despesas',money(-ps.filter(p=>p.value<0).reduce((a,p)=>a+p.value,0)),'Lançamentos demonstrativos']])+`<section class="panel"><h2>Lançamentos</h2>${paymentTable(ps,true)}</section><div class="grid"><section class="panel"><h2>Simular encargos de atraso</h2><form onsubmit="event.preventDefault();lateCalc()"><label>Valor da parcela (R$)</label><input id="latevalue" type="number" min="0.01" step="0.01" value="2400" required><div class="split"><div><label>Dias de atraso</label><input id="latedays" type="number" min="0" value="10" required></div><div><label>Multa (%)</label><input id="latefine" type="number" min="0" value="2" step=".01" required></div></div><label>Juros ao mês (%) · simples, pró-rata de 30 dias</label><input id="laterate" type="number" min="0" value="1" step=".01" required><button>Calcular encargos</button><p id="lateresult"></p></form></section><section class="panel"><h2>Comprovantes recebidos</h2>${db.receipts.map(r=>`<div class="row"><div>${esc(r.name)}<small>${esc(r.file)} · ${esc(r.date)}</small></div>${badge('Em análise')}</div>`).join('')||'<p>Nenhum comprovante anexado. Teste o envio pelo portal do comprador.</p>'}<div class="notice">Boletos, Pix e lembretes são simulados. Taxas futuras, juros, multas e reajustes dependem das regras aprovadas pelo empreendimento.</div></section></div>`}
function paymentTable(ps,admin){return table(['Cliente / descrição','Lote','Vencimento','Valor','Situação','Ações'],ps.map(p=>`<tr><td>${esc(p.name)}<small style="display:block;margin-top:5px;color:var(--muted)">${esc(p.type)}</small></td><td>${p.lot}</td><td>${p.date.split('-').reverse().join('/')}</td><td>${money(p.value)}</td><td>${badge(p.status)}</td><td>${p.status!=='Pago'?`${p.value>0?`<button onclick="charge(${p.id})">Cobrança</button> `:''}${admin?`<button onclick="markPaid(${p.id})">Dar baixa</button> <button onclick="toast('Lembrete simulado: nenhum envio foi realizado.')">Lembrar</button>`:''}`:'—'}</td></tr>`))}function markPaid(id){modal(`<h2>Confirmar baixa demonstrativa?</h2><p>O lançamento será marcado como pago apenas neste navegador.</p><button class="primary" onclick="db.payments.find(p=>p.id===${id}).status='Pago';save();$('#modal').close();render();toast('Baixa registrada.')">Confirmar baixa</button>`)}function charge(id){let p=db.payments.find(x=>x.id===id);modal(`<div class="eyebrow">COBRANÇA SIMULADA</div><h1>${money(p.value)}</h1><p>${esc(p.name)} · Lote ${p.lot}<br>Vencimento: ${p.date.split('-').reverse().join('/')}</p><div class="notice">Esta demonstração não emite boleto nem possui chave Pix válida. Não efetue pagamentos.</div><button onclick="downloadText('cobranca-demonstrativa.txt','DEMONSTRAÇÃO — SEM VALIDADE PARA PAGAMENTO\nLote ${p.lot}\nValor: ${p.value}\nVencimento: ${p.date}')">Baixar demonstrativo</button>`)}function expenseForm(){modal(`<h1>Novo lançamento</h1><form onsubmit="newExpense(event)"><label>Descrição</label><input name="name" required maxlength="100"><label>Categoria</label><select name="type"><option>Despesa</option><option>Receita</option><option>Taxa de associação</option></select><label>Valor (R$)</label><input name="value" type="number" min=".01" step=".01" required><label>Vencimento</label><input name="date" type="date" required><button class="primary">Salvar lançamento</button></form>`)}function newExpense(e){e.preventDefault();let f=new FormData(e.target);db.payments.push({id:Date.now(),name:f.get('name'),type:f.get('type'),value:+f.get('value')*(f.get('type')==='Despesa'?-1:1),date:f.get('date'),lot:'—',status:'Pendente'});save();$('#modal').close();render()}function lateCalc(){let v=+$('#latevalue').value,d=+$('#latedays').value,f=+$('#latefine').value,r=+$('#laterate').value;$('#lateresult').textContent='Total simulado: '+money(v*(1+(d>0?f/100:0)+r/100*d/30))}
function documents(){return title('Documentos organizados','Consulte materiais do empreendimento e modelos demonstrativos.')+`<div class="notice">Plantas recebidas apresentam versões e áreas diferentes. A versão vigente deve ser validada antes do uso comercial. Documentos de clientes nesta demonstração são modelos sem validade jurídica.</div><section class="panel">${[['Planta técnica de referência','Prévia da planta de drenagem · áreas provisórias','map'],['Mapa de vendas recebido','Referência comercial · legenda e numeração a confirmar','sales'],['Geometria georreferenciada','37 linhas do KML · sem informação de altitude','topography'],['Proposta comercial demonstrativa','Modelo gerado no simulador','proposal'],['Contrato de compra · exemplo','Estrutura ilustrativa, sem assinatura ou validade contratual','contract'],['Demonstrativo de parcelas · Ana Costa','Informações fictícias do portal','statement']].filter(x=>role!=='Comprador'||x[2]!=='proposal').map(([t,d,k])=>`<div class="row"><div><b>${t}</b><small>${d}</small></div><button onclick="doc('${k}')">Abrir →</button></div>`).join('')}</section>`}function doc(k){if(k==='sales'||k==='topography'){modal(`<h2>${k==='sales'?'Mapa de vendas recebido':'Geometria do KML'}</h2><div class="notice">${k==='sales'?'Cores sem legenda confirmada e rótulos repetidos. Não representa disponibilidade validada.':'37 linhas georreferenciadas; altitudes iguais a zero. Não é um modelo de relevo.'}</div><img src="assets/${k==='sales'?'sales-map.png':'topography.svg'}" style="width:100%" alt="Referência do empreendimento">`);return}if(k==='map'){modal('<h2>Planta de referência provisória</h2><p>Use o mapa interativo para consultar os lotes. Há divergências entre as versões recebidas.</p><img src="assets/map.png" style="width:100%" alt="Prévia da planta">');return}if(k==='proposal'){go('Propostas');return}let text=k==='contract'?'MODELO DEMONSTRATIVO — SEM VALIDADE CONTRATUAL\n\nContrato de compra de lote\n\nPartes: comprador fictício e function notices(){return title('Uma comunicação mais próxima','Novidades e informações para os compradores.',role==='Gestor'?'<button class="primary" onclick="noticeForm()">+ Novo comunicado</button>':'')+db.notices.map(n=>`<article class="panel"><div class="eyebrow">COMUNICADO · DEMONSTRAÇÃO</div><h2 style="margin-top:15px">${esc(n.title)}</h2><p>${esc(n.text)}</p></article>`).join('')}function noticeForm(){modal('<h1>Novo comunicado</h1><form onsubmit="addNotice(event)"><label>Título</label><input name="title" required maxlength="150"><label>Mensagem</label><textarea name="text" rows="5" required maxlength="3000"></textarea><button class="primary">Publicar na demonstração</button></form>')}function addNotice(e){e.preventDefault();let f=new FormData(e.target);db.notices.unshift({title:f.get('title'),text:f.get('text')});save();$('#modal').close();render();toast('Comunicado disponível no portal de demonstração.')}

function portal(){let l=lots.find(l=>l.id===12);return title('Seu novo capítulo começa aqui, Ana.','Acompanhe sua compra e fique perto de tudo o que acontece.')+`<section class="hero" style="background-image:linear-gradient(90deg,rgba(12,49,43,.9),rgba(12,49,43,.1)),url('assets/ITS09972.jpg')"><div class="eyebrow">SEU ESPAÇO NO FLORATTA</div><h2>Lote 012<br>Um lugar para chamar de seu.</h2><p>${l?.area} m² · Compra fictícia para demonstração</p><button onclick="doc('statement')">Ver demonstrativo →</button></section>`+stats([['Meu lote','012',`${l?.area} m² · área a validar`],['Próxima parcela',money(2400),'25/10/2026 · exemplo'],['Pagamentos recebidos',db.payments.filter(p=>p.name==='Ana Costa'&&p.status==='Pago').length,'Registros simulados'],['Documentos','2','Contrato e demonstrativo de exemplo']])+`<section class="panel"><h2>Minhas parcelas e taxas</h2>${paymentTable(db.payments.filter(p=>p.name==='Ana Costa'),false)}<button style="margin-top:20px" onclick="receiptForm()">Enviar comprovante</button></section><div class="grid"><section class="panel"><h2>Comunicados</h2>${db.notices.slice(0,2).map(n=>`<h3>${esc(n.title)}</h3><p>${esc(n.text)}</p>`).join('')}<button onclick="go('Comunicados')">Todos os comunicados</button></section><section class="panel"><h2>Acompanhe o empreendimento</h2><img src="assets/ITS00097.jpg" alt="Foto real do local" style="width:100%;height:170px;object-fit:cover;border-radius:7px"><p>Veja os registros do local e as etapas de infraestrutura.</p><button onclick="go('Obras e galeria')">Ver galeria e obras →</button></section></div>`}function receiptForm(){modal(`<h1>Enviar comprovante</h1><p>Teste com um arquivo de exemplo. Apenas o nome do arquivo será salvo neste navegador.</p><form onsubmit="sendReceipt(event)"><label>Parcela relacionada</label><select name="payment">${db.payments.filter(p=>p.name==='Ana Costa').map(p=>`<option value="${p.id}">${p.date} · ${money(p.value)}</option>`).join('')}</select><label>Arquivo (PDF, JPG ou PNG)</label><input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png" required><button class="primary">Registrar comprovante demonstrativo</button></form>`)}function sendReceipt(e){e.preventDefault();let f=new FormData(e.target),file=f.get('file');db.receipts.push({name:'Ana Costa',file:file.name,date:new Date().toLocaleDateString('pt-BR'),payment:f.get('payment')});save();$('#modal').close();toast('Comprovante registrado para análise. Nenhum arquivo foi enviado a um servidor.')}
function settings(){return title('Preparado para crescer','Uma base para o Floratta hoje e novos empreendimentos amanhã.')+`<section class="panel"><h2>Empreendimento ativo</h2><div class="row"><span>Nome</span><b>Residencial Floratta</b></div><div class="row"><span>Localização</span><b>Marechal Floriano · ES</b></div><div class="row"><span>Base de lotes</span><b>${lots.length} identificados na planta de referência</b></div><div class="row"><span>Operação</span><b>Comercialização · sem moradores</b></div></section><section class="panel"><h2>Acessos da demonstração</h2><p>Gestor acompanha a operação; corretor vê seus atendimentos; comprador acessa o próprio portal. A seleção de perfil demonstra a interface e não constitui controle de acesso seguro.</p><h2>Próximas etapas</h2><p>Validar a planta vigente, quadras, preços e condições comerciais. Conectar autenticação, banco de dados e serviço de cobrança para uma versão operacional.</p><div class="notice">Segunda fase prevista: moradores, reservas de áreas comuns, visitantes e encomendas.</div><button onclick="resetDemo()">Restaurar dados da demonstração</button></section>`}function resetDemo(){modal('<h2>Restaurar demonstração?</h2><p>As alterações feitas neste navegador serão removidas e os exemplos iniciais serão recuperados.</p><button class="primary" onclick="db=structuredClone(seed);save();$(\'#modal\').close();render();toast(\'Demonstração restaurada.\')">Restaurar exemplos</button>')}function exportLots(){downloadText('lotes-floratta-referencia-provisoria.csv','Lote;Area_m2_provisoria;Quadra;Situacao_SIMULADA;Preco_SIMULADO\n'+lots.map(l=>[l.id,String(l.area).replace('.',','),'A validar',state(l),price(l)].join(';')).join('\n'),'text/csv;charset=utf-8')}
$('#role').addEventListener('change',e=>{role=e.target.value;page=role==='Comprador'?'Portal do comprador':'Visão geral';render()});new MutationObserver(()=>{if($('#calcresult')&&!$('#calcresult').innerHTML)calc()}).observe($('#main'),{childList:true});const florattaLotsReady=fetch('assets/lots.json').then(r=>{if(!r.ok)throw Error();return r.json()});

};
filterLots=function(){
 if(mapSource!=='realistic'||!mapMode)return classicFilterLots();
 const q=$('#search').value.trim(),status=$('#status').value,area=$('#area').value;
 const filtered=lots.filter(l=>(!q||String(l.id).includes(q))&&(!status||state(l)===status)&&(!area||(area==='small'?l.area<=500:l.area>500)));
 nature.ids=new Set(filtered.map(l=>l.id));$('#lotcount').textContent=filtered.length+' lotes';
 $('#nature-lot-list').innerHTML=filtered.map(l=>`<button class="nature-lot-button ${nature.selected===l.id?'chosen':''}" onclick="chooseNatureLot(${l.id},true)" aria-label="Lote ${l.id}, ${state(l)}, simulado" aria-pressed="${nature.selected===l.id}"><span class="status-dot ${natureStateClass(l)}"></span><b>${String(l.id).padStart(3,'0')}</b></button>`).join('')||'<p class="empty">Nenhum lote encontrado. Ajuste os filtros.</p>';
 renderNatureDetail();queueMicrotask(()=>{if(page!=='Lotes e mapa'||mapSource!=='realistic'||!$('#nature-viewport'))return;setupNatureEvents();if(!nature.ready)natureFit();else drawNature()});
};
function natureStateClass(l){return state(l)==='Disponível'?'available':state(l)==='Reservado'?'reserved':'sold'}
function renderNatureDetail(){const el=$('#nature-detail');if(!el)return;const l=lots.find(l=>l.id===nature.selected);if(!l){el.innerHTML=`<div class="nature-empty-detail"><div class="eyebrow">SEU PRÓXIMO ENDEREÇO</div><h2>O Floratta,<br>mais perto de você.</h2><p>Toque na área de um lote ou escolha um número abaixo.</p><button class="primary" onclick="natureSector('central')">Explorar lotes centrais →</button></div>`;return}
 el.innerHTML=`<div class="nature-selected"><div class="panelhead"><span class="eyebrow">LOTE SELECIONADO</span><button class="nature-clear" aria-label="Limpar seleção" onclick="nature.selected=null;filterLots()">×</button></div><div class="nature-number">${String(l.id).padStart(3,'0')}</div>${badge(state(l))}<div class="nature-details-row"><div><small>Área provisória</small><b>${l.area.toLocaleString('pt-BR')} <em>m²</em></b></div><div><small>Valor simulado</small><b>${money(price(l))}</b></div></div><div class="nature-detail-actions"><button class="primary" onclick="natureDetails(${l.id})">Ver todos os detalhes →</button><button onclick="reserveFromNature(${l.id})" ${state(l)!=='Disponível'?'disabled':''}>${state(l)==='Disponível'?'Reservar este lote':state(l)==='Reservado'?'Lote reservado':'Lote vendido'}</button></div><small class="nature-smallnote">Dados demonstrativos · quadra a validar</small></div>`;
}
async function natureDetails(id){if(document.fullscreenElement)await document.exitFullscreen();lotDetail(id)}
async function reserveFromNature(id){if(document.fullscreenElement)await document.exitFullscreen();lotDetail(id);reserveForm(id)}
function chooseNatureLot(id,focus){nature.selected=id;nature.showOverlay=true;renderNatureDetail();document.querySelectorAll('.nature-lot-button').forEach(b=>{const active=Number(b.querySelector('b').textContent)===id;b.classList.toggle('chosen',active);b.setAttribute('aria-pressed',active)});const p=parcelShapes.find(p=>p.id===id);if(p&&focus){const v=$('#nature-viewport');nature.scale=Math.max(nature.scale,1.85);nature.x=v.clientWidth/2-p.cx*nature.scale;nature.y=v.clientHeight/2-p.cy*nature.scale}drawNature();const btn=$('#overlay-toggle');if(btn){btn.textContent='Ocultar contornos';btn.setAttribute('aria-pressed','true')}}
function natureLocate(){const id=Number($('#search').value);if(lots.some(l=>l.id===id)){chooseNatureLot(id,true)}else toast('Digite o número de um lote entre 1 e 112.')}
function natureFit(){const v=$('#nature-viewport');if(!v||!v.clientWidth||!v.clientHeight)return;nature.scale=Math.min(v.clientWidth/1600,v.clientHeight/1487)*.98;nature.x=(v.clientWidth-1600*nature.scale)/2;nature.y=(v.clientHeight-1487*nature.scale)/2;nature.ready=true;drawNature()}
function natureSector(name){const v=$('#nature-viewport');const cfg=name==='central'?{x:755,y:980,s:1.85}:name==='north'?{x:410,y:340,s:1.25}:{x:500,y:1050,s:1.25};nature.scale=cfg.s;nature.x=v.clientWidth/2-cfg.x*cfg.s;nature.y=v.clientHeight/2-cfg.y*cfg.s;drawNature()}
function natureZoom(factor,px,py){const v=$('#nature-viewport');if(!v)return;const old=nature.scale,next=Math.max(.2,Math.min(4,old*factor));px=px??v.clientWidth/2;py=py??v.clientHeight/2;const wx=(px-nature.x)/old,wy=(py-nature.y)/old;nature.scale=next;nature.x=px-wx*next;nature.y=py-wy*next;drawNature()}
function drawNature(){const world=$('#nature-world'),svg=$('#nature-svg');if(!world||!svg)return;const scale=nature.scale;world.style.transform=`translate(${nature.x}px,${nature.y}px) scale(${scale})`;const colors={available:'#27a88b',reserved:'#d9aa5b',sold:'#8b9b99'};
 let markup='';for(const p of parcelShapes){const l=lots.find(l=>l.id===p.id);if(!l)continue;const match=nature.ids.has(p.id),selected=nature.selected===p.id,c=colors[natureStateClass(l)],visible=nature.showOverlay;const showNumber=match&&(selected||p.nearest*scale>=38);const points=p.points.map(a=>a.join(',')).join(' ');
 markup+=`<g data-parcel="${p.id}" class="nature-parcel ${selected?'selected':''} ${!match?'filtered':''}" role="button" tabindex="${match?0:-1}" aria-label="Lote ${p.id}, ${l.area} metros quadrados, ${state(l)} (simulado)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();chooseNatureLot(${p.id},true)}"><polygon points="${points}" fill="${selected?'#f2d897':c}" fill-opacity="${!visible?0:!match?.02:selected?.45:.13}" stroke="${selected?'#fff3bf':match?'#ffffffa0':'#ffffff20'}" stroke-width="${!visible?0:selected?3:1}" vector-effect="non-scaling-stroke"/><title>Lote ${p.id} · toque para selecionar</title>`;
 if(showNumber&&visible){const size=selected?48:36;markup+=`<g transform="translate(${p.cx} ${p.cy}) scale(${1/scale})" class="nature-map-number"><rect x="${-size/2}" y="${-size/2}" width="${size}" height="${size}" rx="${selected?13:10}" fill="${selected?'#fff3bf':'#173e35ee'}" stroke="${selected?'#173e35':'#ffffffcc'}" stroke-width="1.5"/><text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="${selected?17:13}" font-weight="700" fill="${selected?'#173e35':'#fff'}">${p.id}</text></g>`}markup+='</g>'}
 if(scale<.9&&!nature.selected){for(const z of [{name:'central',x:1110,y:980,text:'Lotes 1–64'},{name:'north',x:790,y:360,text:'Lotes 101–112'},{name:'south',x:760,y:1380,text:'Lotes 65–100'}])markup+=`<g class="nature-sector" data-sector="${z.name}" transform="translate(${z.x} ${z.y}) scale(${1/scale})" role="button" tabindex="0" aria-label="Ampliar ${z.text}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();natureSector('${z.name}')}"><rect x="-76" y="-25" width="152" height="50" rx="13" fill="#fffffff2" stroke="#d7e7de"/><text text-anchor="middle" y="-3" font-family="Arial" font-size="13" font-weight="700" fill="#164b40">${z.text}</text><text text-anchor="middle" y="15" font-family="Arial" font-size="10" fill="#497869">Toque para aproximar +</text></g>`}
 svg.innerHTML=markup;const zv=$('#nature-zoom-value');if(zv)zv.textContent=Math.round(scale*100)+'%';
}
function setupNatureEvents(){const v=$('#nature-viewport');if(v.dataset.wired)return;v.dataset.wired='true';nature.pointers.clear();
 v.addEventListener('pointerdown',e=>{if(e.button&&e.button!==0)return;nature.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});nature.moved=false;nature.drag={id:e.pointerId,x:e.clientX,y:e.clientY,ox:nature.x,oy:nature.y,target:e.target};v.setPointerCapture(e.pointerId);if(nature.pointers.size===2){const [a,b]=[...nature.pointers.values()];const r=v.getBoundingClientRect(),mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;nature.pinch={distance:Math.hypot(a.x-b.x,a.y-b.y),scale:nature.scale,wx:(mx-nature.x)/nature.scale,wy:(my-nature.y)/nature.scale};nature.moved=true}});
 v.addEventListener('pointermove',e=>{if(!nature.pointers.has(e.pointerId))return;nature.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(nature.pointers.size===2&&nature.pinch){const[a,b]=[...nature.pointers.values()],r=v.getBoundingClientRect(),midX=(a.x+b.x)/2-r.left,midY=(a.y+b.y)/2-r.top;nature.scale=Math.max(.2,Math.min(4,nature.pinch.scale*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,nature.pinch.distance)));nature.x=midX-nature.pinch.wx*nature.scale;nature.y=midY-nature.pinch.wy*nature.scale;nature.moved=true;drawNature()}else if(nature.drag){const dx=e.clientX-nature.drag.x,dy=e.clientY-nature.drag.y;if(Math.hypot(dx,dy)>7)nature.moved=true;nature.x=nature.drag.ox+dx;nature.y=nature.drag.oy+dy;const w=$('#nature-world');w.style.transform=`translate(${nature.x}px,${nature.y}px) scale(${nature.scale})`}});
 v.addEventListener('pointerup',e=>{const d=nature.drag,wasPinch=!!nature.pinch;if(!nature.moved&&!wasPinch&&d){const target=d.target.closest('[data-parcel],[data-sector]');if(target?.dataset.parcel)chooseNatureLot(Number(target.dataset.parcel),true);if(target?.dataset.sector)natureSector(target.dataset.sector)}nature.pointers.delete(e.pointerId);nature.pinch=null;nature.drag=null;if(nature.pointers.size){const[id,p]=[...nature.pointers.entries()][0];nature.drag={id,x:p.x,y:p.y,ox:nature.x,oy:nature.y,target:v};nature.moved=true}drawNature()});
 v.addEventListener('pointercancel',e=>{nature.pointers.delete(e.pointerId);nature.drag=null;nature.pinch=null;nature.moved=true});v.addEventListener('wheel',e=>{e.preventDefault();const r=v.getBoundingClientRect();natureZoom(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
}
function natureFullscreen(){const shell=$('.nature-shell');if(document.fullscreenElement){document.exitFullscreen?.()}else if(shell.requestFullscreen){shell.requestFullscreen().catch(()=>toast('Use o zoom do mapa neste dispositivo.'))}else toast('A tela cheia não está disponível neste navegador. Use os controles de zoom.')}
document.addEventListener('fullscreenchange',()=>{if(page==='Lotes e mapa'&&mapSource==='realistic')setTimeout(natureFit,100)});
window.addEventListener('resize',()=>{if(page==='Lotes e mapa'&&mapSource==='realistic'&&!nature.selected)natureFit()});
const regularGo=go;go=function(p){if(p==='Lotes e mapa'&&page!=='Lotes e mapa')nature.ready=false;regularGo(p)};
</script><script>/* Bellos portfolio: each property owns its inventory and demo records. */
let portfolio, activeProperty=null, bellosReady=false;
const portfolioKey='bellos-empreendimentos-v1';
const original={render,dashboard,lotpage,filterLots,lotDetail,proposals,documents,works,portal,state,price,leadForm,saveLead,receiptForm};
function emptyRecords(){return {states:{},reservations:{},leads:[],payments:[],notices:[],proposals:[],receipts:[],expenses:[]}}
function isFloratta(){return activeProperty?.id==='floratta'}
function persistPortfolio(){try{localStorage.setItem(portfolioKey,JSON.stringify(portfolio));return true}catch(e){toast('Não foi possível salvar neste navegador. Exporte um backup antes de sair.');return false}}
save=function(){if(activeProperty){activeProperty.data=db;activeProperty.lots=lots}return persistPortfolio()};
function bootBellos(data){let saved;try{saved=JSON.parse(localStorage.getItem(portfolioKey))}catch{}portfolio=saved?.version===1&&Array.isArray(saved.properties)&&saved.properties.length?saved:{version:1,properties:[{id:'floratta',name:'Residencial Floratta',city:'Marechal Floriano · ES',type:'Loteamento',phase:'Comercialização',color:'#008780',description:'Um novo jeito de viver nas montanhas capixabas.',lots:data,data:db}]};bellosReady=true;persistPortfolio();showPortfolio()}
function openProperty(id){const p=portfolio.properties.find(p=>p.id===id);if(!p)return;activeProperty=p;lots=p.lots;db=p.data;role='Gestor';page='Visão geral';mapSource=isFloratta()?'realistic':'profile';nature.ready=false;nature.selected=null;nature.scale=1;render();window.scrollTo(0,0)}
function showPortfolio(){activeProperty=null;role='Gestor';page='Empreendimentos';render();window.scrollTo(0,0)}
function brandChrome(){const p=activeProperty;document.documentElement.style.setProperty('--teal',p?.color||'#705487');document.documentElement.style.setProperty('--deep',p?.color||'#392b49');document.title=(p?p.name+' | ':'')+'Bellos Empreendimentos';$('#property-brand').innerHTML=p?(isFloratta()?'<img class="logo" src="assets/logo.png" alt="Residencial Floratta">':`<div class="property-monogram">${esc(p.name.slice(0,2).toUpperCase())}</div><strong>${esc(p.name)}</strong>`):'<div class="bellos-symbol">B</div><strong class="bellos-name">Bellos</strong><span class="bellos-sub">EMPREENDIMENTOS</span>';$('#brand-context').textContent=p?'UM EMPREENDIMENTO BELLOS':'GESTÃO DE EMPREENDIMENTOS';$('#location').textContent=p?p.city:'Uma gestão. Novas possibilidades.';$('#company-crumb').textContent=p?p.name:'Bellos Empreendimentos';$('.avatar').textContent=p?p.name.slice(0,2).toUpperCase():'BE';$('#role').hidden=!p;$('#role').value=role;$('#role').options[1].textContent=isFloratta()?'Corretora · Marina Alves':'Corretor · equipe comercial';$('#role').options[3].textContent=isFloratta()?'Compradora · Ana Costa':'Comprador · demonstração';document.body.classList.toggle('portfolio-view',!p)}
render=function(){if(!bellosReady)return;brandChrome();if(!activeProperty){$('#crumb').textContent='Portfólio';$('#nav').innerHTML='<button class="active" onclick="showPortfolio()">◫ Empreendimentos</button><button onclick="backupPortfolio()">↓ Exportar backup</button>';$('#main').innerHTML=portfolioView();return}original.render();$('#nav').insertAdjacentHTML('afterbegin','<button class="back-portfolio" onclick="showPortfolio()">← Todos os empreendimentos</button>')};
title=function(t,desc,action=''){return `<div class="titlebar"><div><div class="eyebrow">${esc(activeProperty?.name||'BELLOS EMPREENDIMENTOS')}</div><h1>${t}</h1><p>${desc}</p></div>${action}</div>`};
function propertyState(p,l){return p.data.states[l.id]||(p.id==='floratta'?(l.id===12||l.id%11===0?'Vendido':l.id%7===0?'Reservado':'Disponível'):'Disponível')}
state=function(l){return propertyState(activeProperty,l)};
price=function(l){return l?isFloratta()?original.price(l):Number(l.price)||0:0};
function portfolioView(){const ps=portfolio.properties,all=ps.flatMap(p=>p.data.payments);return `<section class="portfolio-hero"><div><div class="eyebrow">BELLOS EMPREENDIMENTOS</div><h1>Seu portfólio.<br>Uma visão completa.</h1><p>Conecte a gestão dos seus empreendimentos.<br>Preserve a identidade de cada lugar.</p><button class="primary" onclick="propertyForm()">+ Novo empreendimento</button></div><div class="portfolio-art" aria-hidden="true"><span></span><span></span><span></span><b>B</b></div></section>`+stats([['Empreendimentos',ps.length,'Perfis independentes'],['Lotes e unidades',ps.reduce((n,p)=>n+p.lots.length,0),'Inventário cadastrado'],['Recebido',money(all.filter(p=>p.status==='Pago'&&p.value>0).reduce((n,p)=>n+p.value,0)),'Registros da demonstração'],['A receber',money(all.filter(p=>p.status!=='Pago'&&p.value>0).reduce((n,p)=>n+p.value,0)),'Inclui parcelas vencidas']])+`<div class="portfolio-section"><div><h2>Seus empreendimentos</h2><p>Escolha um perfil para entrar na operação.</p></div><span>${ps.length} ${ps.length===1?'empreendimento':'empreendimentos'}</span></div><div class="property-grid">${ps.map(p=>`<article class="property-card"><div class="property-cover ${p.id==='floratta'?'floratta-cover':''}" style="--property-color:${esc(p.color)}">${p.id==='floratta'?'<img src="assets/ITS00080.jpg" alt="Paisagem do Residencial Floratta">':`<span>${esc(p.name.slice(0,2).toUpperCase())}</span>`}<b>${esc(p.type)}</b></div><div class="property-card-body"><small>${esc(p.city)}</small><h2>${esc(p.name)}</h2><p>${esc(p.phase)}</p><div class="property-metrics"><div><strong>${p.lots.length}</strong><small>Unidades</small></div><div><strong>${p.lots.filter(l=>propertyState(p,l)==='Disponível').length}</strong><small>Disponíveis</small></div><div><strong>${p.data.leads.length}</strong><small>Clientes</small></div></div><button class="primary" onclick="openProperty('${p.id}')">Acessar empreendimento →</button></div></article>`).join('')}<button class="new-property" onclick="propertyForm()"><span>+</span><b>O próximo empreendimento<br>começa aqui.</b><small>Mesma estrutura de gestão.<br>Nova identidade e dados próprios.</small></button></div><section class="panel portfolio-note"><h2>Uma base preparada para crescer</h2><p>Comercial, propostas, financeiro, documentos e portal em cada perfil. O Floratta conserva seu mapa interativo, suas fotos e a interface já construída.</p><small>Demonstração local: os dados ficam neste navegador. Perfis de acesso são simulações; login seguro, equipe compartilhada e cobranças reais dependem da próxima etapa.</small></section>`}
function propertyForm(edit=false){const p=edit?activeProperty:{};modal(`<div class="eyebrow">BELLOS EMPREENDIMENTOS</div><h1>${edit?'Identidade do empreendimento':'Novo empreendimento'}</h1><p>${edit?'Atualize a apresentação deste perfil.':'Crie um perfil independente com os mesmos módulos de gestão.'}</p><form onsubmit="saveProperty(event,${edit})"><label>Nome do empreendimento</label><input name="name" maxlength="80" required value="${esc(p.name||'')}" placeholder="Ex.: Residencial das Montanhas"><label>Cidade / estado</label><input name="city" maxlength="100" required value="${esc(p.city||'')}" placeholder="Ex.: Marechal Floriano · ES"><div class="split"><div><label>Tipo</label><select name="type">${['Loteamento','Condomínio horizontal','Condomínio vertical'].map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div><label>Fase</label><select name="phase">${['Comercialização','Implantação','Em operação'].map(t=>`<option ${p.phase===t?'selected':''}>${t}</option>`).join('')}</select></div></div><label>Cor principal</label><input name="color" type="color" value="${esc(p.color||'#705487')}"><label>Apresentação</label><textarea name="description" maxlength="300">${esc(p.description||'')}</textarea><button class="primary">${edit?'Salvar identidade':'Criar empreendimento'}</button></form>`)}
function createProperty(values){const p={id:'p-'+crypto.randomUUID(),...values,lots:[],data:emptyRecords()};portfolio.properties.push(p);persistPortfolio();return p}
function saveProperty(e,edit){e.preventDefault();const f=new FormData(e.target),values={name:f.get('name').trim(),city:f.get('city').trim(),type:f.get('type'),phase:f.get('phase'),color:f.get('color'),description:f.get('description').trim()};if(!values.name||!values.city)return;const p=edit?Object.assign(activeProperty,values):createProperty(values);persistPortfolio();$('#modal').close();openProperty(p.id);toast(edit?'Identidade atualizada.':'Empreendimento criado com dados próprios.')}
function backupPortfolio(){downloadText('bellos-empreendimentos-backup.json',JSON.stringify(portfolio,null,2),'application/json');toast('Backup exportado com todos os empreendimentos.')}
function emptyPanel(text,button=''){return `<section class="panel empty-profile"><span>◇</span><h2>${text}</h2><p>Este perfil tem seus próprios registros. Comece pelos dados do empreendimento.</p>${button}</section>`}
dashboard=function(){if(isFloratta())return original.dashboard();return title(esc(activeProperty.name),esc(activeProperty.description||'Sua operação começa aqui.'),'<button class="primary" onclick="unitForm()">+ Cadastrar unidades</button>')+stats([['Unidades',lots.length,'Inventário deste empreendimento'],['Disponíveis',lots.filter(l=>state(l)==='Disponível').length,'Situação cadastrada'],['Clientes',db.leads.length,'Atendimentos neste perfil'],['A receber',money(db.payments.filter(p=>p.value>0&&p.status!=='Pago').reduce((s,p)=>s+p.value,0)),'Registros deste perfil']])+`<section class="panel"><h2>Prepare seu empreendimento</h2><div class="setup-list"><button onclick="propertyForm(true)"><b>01 · Identidade</b><span>Nome, localização e cor da marca →</span></button><button onclick="go('Lotes e mapa')"><b>02 · Unidades</b><span>Cadastre lotes, áreas e valores →</span></button><button onclick="go('Comercial')"><b>03 · Operação comercial</b><span>Comece os atendimentos →</span></button><button onclick="go('Financeiro')"><b>04 · Financeiro</b><span>Registre receitas e despesas →</span></button></div></section>`};
lotpage=function(){if(isFloratta())return original.lotpage();return title('Lotes e unidades','Inventário exclusivo deste empreendimento.','<button class="primary" onclick="unitForm()">+ Cadastrar unidades</button>')+(lots.length?`<div class="lots">${lots.map(l=>`<button class="lot" onclick="lotDetail(${l.id})">${badge(state(l))}<strong>Unidade ${l.id}</strong><small>${esc(l.block||'Sem quadra')} · ${l.area} m²</small><p>${money(price(l))}</p></button>`).join('')}</div>`:emptyPanel('Cadastre as primeiras unidades','<button onclick="unitForm()">Adicionar unidades</button>'))+'<section class="panel"><h2>Mapa do empreendimento</h2><p>A implantação de um mapa interativo depende da planta deste empreendimento. O mapa do Floratta permanece exclusivo do perfil Floratta.</p></section>'};
filterLots=function(){if(isFloratta())original.filterLots()};
function unitForm(){if(isFloratta()){go('Lotes e mapa');return}modal('<h1>Cadastrar unidades</h1><p>Crie uma unidade ou uma sequência com as mesmas características.</p><form onsubmit="saveUnits(event)"><div class="split"><div><label>Número inicial</label><input name="start" type="number" min="1" max="999999" required value="1"></div><div><label>Quantidade</label><input name="count" type="number" min="1" max="500" required value="1"></div></div><label>Quadra / bloco</label><input name="block" maxlength="50"><label>Área por unidade (m²)</label><input name="area" type="number" min="1" step="0.01" required><label>Valor por unidade (R$) · demonstração</label><input name="price" type="number" min="0" step="0.01" required><button class="primary">Cadastrar neste empreendimento</button></form>')}
function saveUnits(e){e.preventDefault();const f=new FormData(e.target),start=+f.get('start'),count=+f.get('count');if(count<1||count>500||!Number.isInteger(count))return;const ids=Array.from({length:count},(_,i)=>start+i);if(ids.some(id=>lots.some(l=>l.id===id))){toast('Já existe uma unidade nessa sequência. Escolha outro número inicial.');return}lots.push(...ids.map(id=>({id,area:+f.get('area'),price:+f.get('price'),block:f.get('block')})));save();$('#modal').close();go('Lotes e mapa');toast('Unidades cadastradas neste empreendimento.')}
lotDetail=function(id){if(isFloratta())return original.lotDetail(id);const l=lots.find(l=>l.id===id);modal(`<h1>Unidade ${id}</h1>${badge(state(l))}<p>${esc(l.block||'Sem quadra')} · ${l.area} m²</p><h2>${money(price(l))}</h2><p>Valor cadastrado na demonstração.</p><div class="actions">${state(l)==='Disponível'?`<button onclick="reserveForm(${id})">Reservar unidade</button>`:state(l)==='Reservado'?`<button onclick="releaseLot(${id})">Liberar reserva</button>`:''}<button onclick="$('#modal').close();go('Propostas');$('#simlot').value='${id}';calc()">Simular proposta</button></div>`)};
proposals=function(){if(!lots.length)return title('Propostas','Simulações deste empreendimento.')+emptyPanel('Cadastre unidades para simular propostas','<button onclick="go(\'Lotes e mapa\')">Cadastrar unidades</button>');return original.proposals().replaceAll('Marina Alves',isFloratta()?'Marina Alves':'Equipe comercial').replace('Preço-base fictício de R$ 650/m², arredondado.',isFloratta()?'Preço-base fictício de R$ 650/m², arredondado.':'Valores cadastrados nas unidades deste empreendimento.')};
leadForm=function(id){if(isFloratta())return original.leadForm(id);const l=db.leads.find(x=>x.id===id)||{};modal(`<h1>${id?'Editar atendimento':'Novo interessado'}</h1><form onsubmit="saveLead(event,${id||0})"><label>Nome</label><input name="name" required maxlength="100" value="${esc(l.name||'')}"><label>Unidade de interesse</label><select name="lot"><option value="0">A definir</option>${lots.map(x=>`<option value="${x.id}" ${l.lot===x.id?'selected':''}>Unidade ${x.id}</option>`).join('')}</select><label>Responsável</label><input name="owner" required maxlength="100" value="${esc(l.owner||'Equipe comercial')}"><label>Histórico</label><textarea name="note" maxlength="2000">${esc(l.note||'')}</textarea><button class="primary">Salvar atendimento</button></form>`)};
saveLead=function(e,id){if(isFloratta())return original.saveLead(e,id);e.preventDefault();const f=new FormData(e.target),old=db.leads.find(x=>x.id===id),l={id:id||Date.now(),name:f.get('name'),lot:+f.get('lot'),owner:role==='Corretor'?'Equipe comercial':f.get('owner'),note:f.get('note'),stage:old?.stage||'Novo contato'};if(old)Object.assign(old,l);else db.leads.push(l);save();$('#modal').close();render();toast('Atendimento salvo neste empreendimento.')};
visibleLeads=function(){return role==='Corretor'?db.leads.filter(l=>l.owner===(isFloratta()?'Marina Alves':'Equipe comercial')):db.leads};
visiblePayments=function(){return role==='Comprador'?db.payments.filter(p=>p.name===(isFloratta()?'Ana Costa':db.leads.find(l=>l.stage==='Fechado')?.name)):db.payments};
documents=function(){return isFloratta()?original.documents():title('Documentos','Documentos exclusivos deste empreendimento.')+emptyPanel('Nenhum documento cadastrado')};
works=function(){return isFloratta()?original.works():title('Obras e galeria','Acompanhamento próprio do empreendimento.')+emptyPanel('Nenhum registro de obra cadastrado')};
portal=function(){return isFloratta()?original.portal():title('Portal do comprador',esc(activeProperty.name))+emptyPanel('Portal preparado para este empreendimento')};
settings=function(){return title('Configurações','Identidade e estrutura do empreendimento ativo.')+`<section class="panel"><h2>${esc(activeProperty.name)}</h2><div class="row"><span>Localização</span><b>${esc(activeProperty.city)}</b></div><div class="row"><span>Tipo / fase</span><b>${esc(activeProperty.type)} · ${esc(activeProperty.phase)}</b></div><div class="row"><span>Inventário</span><b>${lots.length} unidades</b></div><button onclick="propertyForm(true)">Editar identidade</button></section><section class="panel"><h2>Gestão Bellos</h2><p>Cada empreendimento mantém seu próprio inventário, clientes, propostas, financeiro e comunicados. Novos perfis reutilizam a estrutura de navegação e começam sem registros.</p><div class="actions"><button onclick="showPortfolio()">Ver todos os empreendimentos</button><button onclick="propertyForm()">+ Novo empreendimento</button><button onclick="backupPortfolio()">Exportar backup</button></div></section><section class="panel"><h2>Sobre esta demonstração</h2><p>Os dados ficam apenas neste navegador, sem sincronização com outras pessoas. A seleção Gestor / Corretor / Comprador demonstra interfaces, sem autenticação ou autorização de acesso real.</p><p>Etapa operacional: banco de dados, permissões por empreendimento, login e integração de cobranças. Moradores, reservas de áreas comuns, visitantes e encomendas permanecem previstos para a segunda fase.</p></section>`};
downloadProposal=function(id){const p=db.proposals.find(p=>p.id===id);downloadText('proposta-bellos-demo.txt',`${activeProperty.name} — BELLOS EMPREENDIMENTOS\nPROPOSTA DEMONSTRATIVA · Sem validade contratual\nCliente: ${p.name}\nUnidade ${p.lot}\nValor: ${money(p.total)}\nEntrada: ${money(p.entry)}\nParcelamento: ${p.months} × ${money(p.payment)}\nJuros mensais: ${p.interest*100}%`)};
exportLots=function(){downloadText('unidades-bellos.csv','Empreendimento;Unidade;Area_m2;Situacao;Preco_demo\n'+lots.map(l=>[activeProperty.name,l.id,l.area,state(l),price(l)].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\n'),'text/csv;charset=utf-8')};
florattaLotsReady.then(bootBellos).catch(()=>$('#main').innerHTML='<h1>Não foi possível carregar a plataforma.</h1><p>Atualize a página para tentar novamente.</p>');
// Profile-specific document registry and buyer view, without Floratta examples.
documents=function(){if(isFloratta())return original.documents();const docs=db.documents||[];return title('Documentos','Registro de documentos deste empreendimento.','<button onclick="documentForm()">+ Registrar documento</button>')+`<section class="panel">${docs.map(d=>`<div class="row"><div><b>${esc(d.title)}</b><small>${esc(d.file)} · ${esc(d.date)}</small></div>${badge('Registrado')}</div>`).join('')||'<p>Nenhum documento registrado.</p>'}<p>Na demonstração, apenas o nome e a referência do arquivo são salvos.</p></section>`};
function documentForm(){modal('<h1>Registrar documento</h1><form onsubmit="saveDocument(event)"><label>Título</label><input name="title" required maxlength="100"><label>Arquivo de referência</label><input name="file" type="file" accept=".pdf,.doc,.docx,.jpg,.png" required><p>O conteúdo do arquivo não será armazenado nesta demonstração.</p><button class="primary">Registrar</button></form>')}
function saveDocument(e){e.preventDefault();const f=new FormData(e.target);(db.documents??=[]).push({title:f.get('title'),file:f.get('file').name,date:new Date().toLocaleDateString('pt-BR')});save();$('#modal').close();render()}
portal=function(){if(isFloratta())return original.portal();const buyer=db.leads.find(l=>l.stage==='Fechado');if(!buyer)return title('Portal do comprador',esc(activeProperty.name))+emptyPanel('Nenhum comprador vinculado','<p>O portal demonstrará o primeiro cliente com atendimento marcado como “Fechado”.</p>');const ps=db.payments.filter(p=>p.name===buyer.name);return title('Olá, '+esc(buyer.name),esc(activeProperty.name))+`<section class="panel"><h2>Minha unidade</h2><p>Unidade ${buyer.lot||'a definir'}</p></section><section class="panel"><h2>Parcelas e pagamentos</h2>${ps.length?paymentTable(ps,false):'<p>Nenhum lançamento vinculado a este comprador.</p>'}</section><section class="panel"><h2>Comunicados</h2>${db.notices.map(n=>`<h3>${esc(n.title)}</h3><p>${esc(n.text)}</p>`).join('')||'<p>Nenhum comunicado publicado.</p>'}</section>`};
</script><script>/* Owner registration preparation. No local password storage or pretend authentication. */
const renderBeforeOwners=render;
function owners(){return activeProperty.data.owners??=[]}
function ownerAccess(){return activeProperty&&['Gestor','Corretor'].includes(role)}
render=function(){if(!bellosReady)return;if(activeProperty&&role==='Proprietário'){renderMemberPanel();return}if(page==='Proprietários'&&ownerAccess()){brandChrome();$('#crumb').textContent='Proprietários';$('#nav').innerHTML='<button onclick="showPortfolio()">← Todos os empreendimentos</button>'+menus.map(([n,i])=>`<button onclick="go('${n}')"><i>${i}</i>${n}</button>`).join('');$('#main').innerHTML=ownersPage();if(role==='Corretor')$('#nav').innerHTML='<button onclick="showPortfolio()">← Todos os empreendimentos</button>'+menus.filter(([n])=>['Visão geral','Lotes e mapa','Comercial','Propostas','Documentos','Obras e galeria'].includes(n)).map(([n,i])=>`<button onclick="go('${n}')"><i>${i}</i>${n}</button>`).join('')}else renderBeforeOwners();if(ownerAccess())$('#nav').insertAdjacentHTML('beforeend',`<button class="${page==='Proprietários'?'active':''}" onclick="go('Proprietários')">♙ Proprietários e acessos</button>`);if(ownerAccess())$('#nav').insertAdjacentHTML('beforeend','<button onclick="previewMember()">◎ Painel do proprietário</button>')};
function ownersPage(){const list=owners();return title('Proprietários e acessos','Cadastre os proprietários e vincule suas unidades neste empreendimento.','<button class="primary" onclick="ownerForm()">+ Cadastrar proprietário</button>')+`<div class="notice"><b>Ativação dos logins pendente.</b> O cadastro abaixo é demonstrativo e fica neste navegador. Nenhuma conta ou convite de acesso é criado até a conexão com o serviço de autenticação.</div>`+stats([['Proprietários',list.length,'Neste empreendimento'],['Unidades vinculadas',new Set(list.filter(o=>o.enabled).flatMap(o=>o.units)).size,'Vínculos explícitos'],['Logins ativos','0','Autenticação ainda não conectada'],['Cadastros habilitados',list.filter(o=>o.enabled).length,'Aguardam ativação do acesso']])+`<section class="panel">${list.length?table(['Proprietário','Unidades','Cadastro','Ações'],list.map(o=>`<tr><td><b>${esc(o.name)}</b><small style="display:block">${esc(o.email)}</small></td><td>${o.units.join(', ')||'Sem vínculo'}</td><td>${badge(o.enabled?'Aguardando ativação':'Desabilitado')}</td><td><button onclick="ownerForm('${o.id}')">Editar</button> <button onclick="toggleOwner('${o.id}')">${o.enabled?'Desabilitar':'Habilitar'}</button></td></tr>`)):'<div class="empty-profile"><h2>O acesso começa pelo cadastro</h2><p>Adicione nome, e-mail e as unidades pertencentes a cada proprietário.</p><button onclick="ownerForm()">Cadastrar primeiro proprietário</button></div>'}</section><section class="panel"><h2>Como será o acesso individual</h2><p>Após a ativação da autenticação, o proprietário definirá sua própria senha e acessará somente suas unidades, parcelas, documentos e comunicados. Gestores e corretores cuidarão dos cadastros dos empreendimentos aos quais estiver vinculado.</p><p>Não solicite nem registre senhas dos proprietários neste cadastro.</p></section>`}
function ownerForm(id){if(!ownerAccess())return;const o=owners().find(o=>o.id===id)||{units:[]};modal(`<div class="eyebrow">${esc(activeProperty.name)}</div><h1>${id?'Editar proprietário':'Cadastrar proprietário'}</h1><form onsubmit="saveOwner(event,'${id||''}')"><label>Nome completo</label><input name="name" value="${esc(o.name||'')}" maxlength="100" required autocomplete="name"><label>E-mail de acesso</label><input name="email" type="email" value="${esc(o.email||'')}" maxlength="254" required autocomplete="email"><label>Vínculo com o condomínio</label><select name="membership"><option value="proprietario" ${o.membership!=='morador'?'selected':''}>Proprietário</option><option value="morador" ${o.membership==='morador'?'selected':''}>Proprietário e morador</option></select><label>Telefone (opcional)</label><input name="phone" type="tel" value="${esc(o.phone||'')}" maxlength="30"><fieldset class="owner-units"><legend>Unidades vinculadas</legend>${lots.length?lots.map(l=>`<label><input type="checkbox" name="units" value="${l.id}" ${o.units.includes(l.id)?'checked':''}> Unidade ${l.id} · ${l.area} m²</label>`).join(''):'<p>Cadastre unidades primeiro. Você poderá fazer o vínculo depois.</p>'}</fieldset><p class="owner-note">Cadastro local demonstrativo. O login ficará pendente de ativação.</p><button class="primary">Salvar cadastro</button></form>`)}
function ownerRecord(values,id){if(!ownerAccess())throw Error('Acesso restrito a gestores e corretores');const email=values.email.trim().toLowerCase();if(owners().some(o=>o.email===email&&o.id!==id))throw Error('Este e-mail já está cadastrado neste empreendimento.');if(values.units.some(n=>!lots.some(l=>l.id===n)))throw Error('Uma das unidades não pertence a este empreendimento.');const existing=owners().find(o=>o.id===id);const data={name:values.name.trim(),email,phone:values.phone.trim(),membership:values.membership==='morador'?'morador':'proprietario',units:[...new Set(values.units)]};if(!data.name||!email)throw Error('Preencha nome e e-mail.');if(existing)Object.assign(existing,data);else owners().push({id:crypto.randomUUID(),...data,enabled:true,authStatus:'pending_configuration'});save()}
function saveOwner(e,id){e.preventDefault();const f=new FormData(e.target);try{ownerRecord({name:f.get('name'),email:f.get('email'),phone:f.get('phone'),membership:f.get('membership'),units:f.getAll('units').map(Number)},id);$('#modal').close();render();toast('Cadastro salvo. Login pendente de ativação.')}catch(err){toast(err.message)}}
function toggleOwner(id){if(!ownerAccess())return;const o=owners().find(o=>o.id===id);if(!o)return;o.enabled=!o.enabled;save();render();toast(o.enabled?'Cadastro habilitado; login ainda pendente.':'Cadastro desabilitado.')}
let selectedMemberByProperty={},memberTab='Resumo';
function selectedMember(){const enabled=owners().filter(o=>o.enabled);return enabled.find(o=>o.id===selectedMemberByProperty[activeProperty.id])||enabled[0]||null}
function previewMember(){if(!ownerAccess())return;role='Proprietário';memberTab='Resumo';render()}
function switchMember(id){if(role!=='Proprietário'||!owners().some(o=>o.id===id&&o.enabled))return;selectedMemberByProperty[activeProperty.id]=id;render()}
function memberPayments(o){return o?db.payments.filter(p=>p.ownerId===o.id&&o.units.includes(Number(p.lot))):[]}
function memberDocuments(o){return o?(db.documents||[]).filter(d=>d.ownerId===o.id||d.audience==='condominio'):[]}
function renderMemberPanel(){brandChrome();const o=selectedMember();$('#crumb').textContent='Painel do proprietário';$('#nav').innerHTML=['Resumo','Minhas unidades','Financeiro','Documentos','Comunicados','Solicitações'].map(t=>`<button class="${t===memberTab?'active':''}" onclick="memberTab='${t}';render()">${esc(t)}</button>`).join('');const picker=owners().filter(o=>o.enabled);const toolbar=`<section class="panel member-picker"><div><b>Proprietário · demonstração</b><p>Selecione um cadastro para visualizar o painel correspondente. Esta seleção não constitui login.</p></div><select aria-label="Proprietário da demonstração" onchange="switchMember(this.value)">${picker.map(x=>`<option value="${x.id}" ${x.id===o?.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></section>`;$('#main').innerHTML=title('Painel do proprietário',esc(activeProperty.name))+toolbar+(!o?emptyPanel('Nenhum proprietário habilitado','<p>Volte ao perfil Gestor ou Corretor e cadastre um proprietário com suas unidades.</p>'):memberContent(o));}
function memberContent(o){const ps=memberPayments(o),units=lots.filter(l=>o.units.includes(l.id));const noticeHtml=()=>`<section class="panel"><h2>Comunicados do condomínio</h2>${db.notices.map(n=>`<article class="row"><div><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p></div></article>`).join('')||'<p>Nenhum comunicado publicado.</p>'}</section>`;if(memberTab==='Resumo')return `<section class="panel member-welcome"><div class="eyebrow">${o.membership==='morador'?'PROPRIETÁRIO E MORADOR':'PROPRIETÁRIO'}</div><h2>Olá, ${esc(o.name)}.</h2><p>Seu espaço para acompanhar o empreendimento e cuidar das suas unidades.</p></section>`+stats([['Minhas unidades',units.length,'Vinculadas ao seu cadastro'],['A pagar',money(ps.filter(p=>p.value>0&&p.status!=='Pago').reduce((n,p)=>n+p.value,0)),'Cobranças vinculadas ao proprietário'],['Documentos',memberDocuments(o).length,'Pessoais e do condomínio'],['Solicitações',(db.memberRequests||[]).filter(r=>r.ownerId===o.id&&r.status!=='Concluída').length,'Em acompanhamento']])+noticeHtml();if(memberTab==='Minhas unidades')return `<div class="lots">${units.map(l=>`<section class="panel"><span class="eyebrow">MINHA UNIDADE</span><h2>Unidade ${l.id}</h2><p>${l.area} m² · ${esc(l.block||'Quadra a confirmar')}</p><p>${esc(o.membership==='morador'?'Proprietário e morador':'Proprietário')}</p></section>`).join('')||'<section class="panel">Nenhuma unidade vinculada ao seu cadastro.</section>'}</div>`;if(memberTab==='Financeiro')return `<section class="panel"><h2>Minhas parcelas e taxas</h2>${ps.length?paymentTable(ps,false):'<p>Nenhuma cobrança vinculada ao seu cadastro.</p>'}<p class="owner-note">Somente lançamentos explicitamente vinculados ao proprietário e às suas unidades aparecem aqui. Cobranças continuam demonstrativas.</p></section>`;if(memberTab==='Documentos')return `<section class="panel"><h2>Meus documentos</h2>${memberDocuments(o).map(d=>`<div class="row"><div><b>${esc(d.title)}</b><small>${esc(d.file||'Documento')} · ${d.audience==='condominio'?'Condomínio':'Pessoal'}</small></div></div>`).join('')||'<p>Nenhum documento disponibilizado para você.</p>'}</section>`;if(memberTab==='Comunicados')return noticeHtml();return `<section class="panel"><h2>Minhas solicitações</h2><button class="primary" onclick="memberRequestForm()">+ Nova solicitação</button>${(db.memberRequests||[]).filter(r=>r.ownerId===o.id).map(r=>`<div class="row"><div><b>${esc(r.title)}</b><small>${esc(r.date)}</small><p>${esc(r.text)}</p></div>${badge(r.status)}</div>`).join('')||'<p>Você ainda não enviou solicitações.</p>'}</section>`}
function memberRequestForm(){if(role!=='Proprietário'||!selectedMember())return;modal('<h1>Nova solicitação</h1><form onsubmit="saveMemberRequest(event)"><label>Assunto</label><input name="title" maxlength="120" required><label>Mensagem</label><textarea name="text" maxlength="2000" required></textarea><p>Registro demonstrativo salvo neste navegador.</p><button class="primary">Registrar solicitação</button></form>')}
function saveMemberRequest(e){e.preventDefault();const o=selectedMember();if(role!=='Proprietário'||!o)return;const f=new FormData(e.target);(db.memberRequests??=[]).push({id:crypto.randomUUID(),ownerId:o.id,title:f.get('title'),text:f.get('text'),status:'Aberta',date:new Date().toLocaleDateString('pt-BR')});save();$('#modal').close();render();toast('Solicitação registrada na demonstração.')}
</script><script>/* Downloads via the artifact viewer's downloads capability, with a browser fallback outside it. */
let bellosDownloads;const bellosDownloadsReady=(window.claude?.use?window.claude.use('downloads'):Promise.resolve(null)).then(d=>bellosDownloads=d).catch(()=>bellosDownloads=null);
function browserDownload(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
downloadText=async function(name,text,type='text/plain'){const d=bellosDownloads===undefined?await bellosDownloadsReady:bellosDownloads;if(!d){browserDownload(name,text,type);return}try{const data=/csv/.test(type)?'\ufeff'+text:text;await d.save({filename:name,data});toast('Arquivo pronto: '+name)}catch(e){if(e?.code==='declined')return;if(e?.code==='rate_limited'){toast('Já há um download aguardando confirmação.');return}toast('Não foi possível baixar o arquivo nesta visualização.')}};
</script></body></html>
