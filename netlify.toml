# Bellos Empreendimentos — publicação no Netlify (mesmos arquivos que o GitHub Pages publica)
[build]
  command = "rm -rf _site && mkdir _site && cp index.html .nojekyll _site/ && cp -r assets _site/"
  publish = "_site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/assets/portal/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
